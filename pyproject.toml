[project]
name = "flyflor-core"
version = "0.1.0"
description = "Flyflor orchestration core for bridge-based multi-agent collaboration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
flyflor = "flyflor_core.cli:main"
flyflor-core = "flyflor_core.__main__:main"
flyflor-bridge = "flyflor_core.bridge_daemon:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flyflor_core*"]

[tool.setuptools.package-data]
flyflor_core = ["schema.sql"]
