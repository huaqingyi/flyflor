services:
  flyflor:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        QDRANT_IMAGE: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        NODE_MAJOR: ${NODE_MAJOR:-22}
    container_name: flyflor
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      HOME: /data/flyflor/agents/home
      FLYFLOR_HOST: 0.0.0.0
      FLYFLOR_PORT: 8080
      FLYFLOR_AUTO_INIT: "1"
      CODEX_HOME: /data/flyflor/agents/codex
      CLAUDE_CONFIG_DIR: /data/flyflor/agents/claude
      COPILOT_CONFIG_DIR: /data/flyflor/agents/copilot
      OPENCODE_CONFIG_DIR: /data/flyflor/agents/opencode
      QWEN_CONFIG_DIR: /data/flyflor/agents/qwen
      KIMI_CONFIG_HOME: /data/flyflor/agents/kimi
      DEEPSEEK_CONFIG_HOME: /data/flyflor/agents/deepseek
      GEMINI_CONFIG_DIR: /data/flyflor/agents/gemini
      DEEPSEEK_MEMORY: "on"
      XDG_CONFIG_HOME: /data/flyflor/xdg/config
      XDG_CACHE_HOME: /data/flyflor/xdg/cache
      XDG_DATA_HOME: /data/flyflor/xdg/data
      TMPDIR: /data/flyflor/tmp
      QDRANT__SERVICE__HOST: 127.0.0.1
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
      - "8765:8765"
    volumes:
      # Persistent runtime data
      - ./data/flyflor:/data/flyflor
      - ./data/qdrant:/data/qdrant
      - ./data/logs:/data/logs
      - ./workspace:/workspace

      # Editable source and config
      - ./flyflor_core:/app/flyflor_core
      - ./vendor/nanobot:/app/vendor/nanobot
      - ./configs:/app/configs:ro
      - ./memory:/app/memory
      - ./README.md:/app/README.md:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    restart: unless-stopped
