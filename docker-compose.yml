services:
  flyflor:
    build:
      context: .
      dockerfile: Dockerfile
    image: flyflor:local
    container_name: flyflor
    restart: unless-stopped
    environment:
      PICOCLAW_HOME: /data/flyflor
      PICOCLAW_CONFIG: /config/config.json
      PICOCLAW_BINARY: /usr/local/bin/flyflor
      PICOCLAW_AGENTS_DEFAULTS_WORKSPACE: /workspace
      PICOCLAW_GATEWAY_HOST: 0.0.0.0
      PICOCLAW_LOG_LEVEL: ${PICOCLAW_LOG_LEVEL:-info}
      QDRANT_URL: http://qdrant:6333
      FLYFLOR_SEMANTIC_MEMORY_ENABLED: "true"
      FLYFLOR_QDRANT_COLLECTION: flyflor_memories
      FLYFLOR_RUNS_DIR: /runs
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,flyflor,qdrant}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      all_proxy: ${all_proxy:-}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1,flyflor,qdrant}
    ports:
      - "18800:18800"
      - "18790:18790"
    volumes:
      - ./config:/config
      - ./data/flyflor:/data/flyflor
      - ./data/workspace:/workspace
      - ./runs:/runs
      - .:/source:ro
    depends_on:
      - qdrant
    command: ["web", "-console", "-no-browser", "-host", "0.0.0.0", "/config/config.json"]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: flyflor-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
